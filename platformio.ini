[env:lolin32_lite]
platform = espressif32
board = lolin32_lite
framework = arduino
monitor_speed = 115200

lib_ldf_mode = chain+ 
build_flags =
    -O3
    -DUSER_SETUP_LOADED
    -include include/User_Setup.h

lib_deps =
    blynkkk/Blynk@^1.3.2
    paulstoffregen/OneWire
    milesburton/DallasTemperature
    bodmer/TFT_eSPI